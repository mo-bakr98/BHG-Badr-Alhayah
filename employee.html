<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة موظفي بدر الحياة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--navy:#10243a;--gold:#c6a66a;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial;color:#182838}.top{background:var(--navy);color:white;padding:18px 5%;font-weight:800;font-size:20px}.top span{color:var(--gold)}main{max-width:900px;margin:30px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px #10243a0a}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #dbe3eb;border-radius:10px;font:inherit}.btn{border:0;background:var(--gold);color:#14283a;padding:11px 18px;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}.secondary{background:#e9eef3}.status{margin-top:10px;color:#26734d}.hidden{display:none!important}.thread{width:100%;text-align:right;padding:12px;border:1px solid #e4e9ef;border-radius:10px;background:#f9fafb;margin:7px 0;cursor:pointer;font:inherit}.msgs{max-height:350px;overflow:auto;background:#f3f6f8;border-radius:12px;padding:12px}.msg{background:white;border-radius:10px;padding:10px;margin:8px}.msg.mine{background:#e4f2e9}.muted{color:#6b7b8a}</style></head><body><header class="top">BHG <span>بدر الحياة</span> — بوابة الموظفين</header><main><section class="panel" id="login"><h2>تسجيل دخول الموظفين</h2><p class="muted">استخدم البريد الذي وصلته دعوة الشركة.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="signIn()">دخول</button><div id="loginStatus" class="status"></div></section><section class="panel hidden" id="portal"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 id="welcome">أهلاً</h2><p id="role" class="muted"></p></div><button class="btn secondary" onclick="signOut()">تسجيل خروج</button></div><h3>محادثات الفريق</h3><div id="threadList">جارٍ تحميل المحادثات…</div><div id="conversation" class="hidden"><h3 id="threadTitle"></h3><div id="messages" class="msgs"></div><div class="field"><label>رسالتك</label><textarea id="message" rows="3" placeholder="اكتب رسالة…"></textarea></div><button class="btn" onclick="sendMessage()">إرسال</button><button class="btn secondary" onclick="refreshMessages()">تحديث</button><div id="chatStatus" class="status"></div></div></section></main><script>
const URL='https://lqycfhqmihobrjyycajr.supabase.co',KEY='sb_publishable_KMi-Q7lZ-dCTPnqIhIogIA_wnw2rnpH';const db=supabase.createClient(URL,KEY);let user=null,profile=null,threadId=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(id,t,bad=false){$(id).textContent=t;$(id).style.color=bad?'#b42318':'#26734d'}
async function signIn(){status('loginStatus','جارٍ التحقق…');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status('loginStatus','تعذر الدخول: '+error.message,true);return;}await loadPortal(data.user);}
async function loadPortal(u){user=u;const {data:p,error}=await db.from('platform_profiles').select('display_name,account_type,role_key,active').eq('user_id',u.id).maybeSingle();if(error||!p||p.account_type!=='employee'||!p.active){await db.auth.signOut();status('loginStatus','هذا الحساب غير مسجل كموظف نشط.',true);return;}profile=p;$('login').classList.add('hidden');$('portal').classList.remove('hidden');$('welcome').textContent='أهلاً '+(p.display_name||u.email);const labels={sales:'مبيعات',marketing:'تسويق',support:'خدمة العملاء',manager:'مدير فريق'};$('role').textContent='القسم: '+(labels[p.role_key]||'موظف');loadThreads();}
async function loadThreads(){const box=$('threadList');box.textContent='جارٍ تحميل محادثاتك…';const {data,error}=await db.from('chat_threads').select('id,title,thread_type,updated_at').order('updated_at',{ascending:false});if(error){box.textContent='تعذر تحميل المحادثات: '+error.message;return;}if(!data?.length){box.textContent='لا توجد محادثات مخصصة لك حتى الآن.';return;}box.innerHTML=data.map(t=>'<button class="thread" onclick="openThread(\''+t.id+'\',\''+esc(t.title||'محادثة')+'\')">'+esc(t.title||'محادثة')+' — '+esc(t.thread_type)+'</button>').join('');}
async function openThread(id,title){threadId=id;$('conversation').classList.remove('hidden');$('threadTitle').textContent=title;await refreshMessages();}
async function refreshMessages(){if(!threadId)return;const {data,error}=await db.from('chat_messages').select('sender_id,body,created_at').eq('thread_id',threadId).order('created_at',{ascending:true}).limit(200);if(error){status('chatStatus','تعذر تحميل الرسائل: '+error.message,true);return;}const box=$('messages');box.innerHTML=!data?.length?'لا توجد رسائل بعد.':data.map(m=>'<div class="msg '+(m.sender_id===user.id?'mine':'')+'"><small>'+esc(m.created_at)+'</small><div>'+esc(m.body||'')+'</div></div>').join('');box.scrollTop=box.scrollHeight;}
async function sendMessage(){const body=$('message').value.trim();if(!body||!threadId)return;const {error}=await db.from('chat_messages').insert({thread_id:threadId,sender_id:user.id,body});if(error){status('chatStatus','تعذر إرسال الرسالة: '+error.message,true);return;}$('message').value='';status('chatStatus','تم الإرسال.');refreshMessages();}
async function signOut(){await db.auth.signOut();user=null;profile=null;threadId=null;$('portal').classList.add('hidden');$('login').classList.remove('hidden');$('conversation').classList.add('hidden');}
db.auth.getSession().then(({data})=>{if(data.session)loadPortal(data.session.user);});
</script></body></html>
