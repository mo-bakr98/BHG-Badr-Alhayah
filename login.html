<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | بدر الحياة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f9;color:#183149;font-family:Cairo,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}button,input{font:inherit}
header{height:62px;background:#001d39;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}
.brand{font-weight:800;font-size:19px}.brand span{color:#7bbde8}
.back{font-size:13px;color:#d8eaf6}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 16px}
.card{width:min(440px,100%);background:#fff;border:1px solid #dce6ed;border-radius:16px;padding:28px;box-shadow:0 8px 28px #001d3910}
.branding{text-align:center;margin-bottom:22px}
.branding img{display:none;max-width:125px;max-height:65px;object-fit:contain;margin:0 auto 8px}
.branding h1{font-size:22px;margin:0;color:#001d39}
.branding p{font-size:12px;color:#71869a;margin:4px 0 0}
.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#eef3f7;border-radius:10px;margin-bottom:20px}
.role-btn{border:0;border-radius:8px;padding:10px 6px;background:transparent;color:#60778a;font-weight:800;font-size:13px;cursor:pointer}
.role-btn.active{background:#001d39;color:#fff}
.customer-mode{display:flex;gap:18px;margin:0 0 16px;justify-content:center}
.mode-link{border:0;background:transparent;color:#688096;font-size:13px;font-weight:700;padding:3px;cursor:pointer}
.mode-link.active{color:#0a5e90;border-bottom:2px solid #0a5e90}
h2.form-title{font-size:17px;color:#183b57;margin:0 0 14px}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input{width:100%;height:44px;border:1px solid #d4e0e8;border-radius:9px;padding:0 12px;background:#fff;outline:none}
.field input:focus{border-color:#4b91bd;box-shadow:0 0 0 2px #7bbde822}
.primary-btn{width:100%;height:45px;border:0;border-radius:9px;background:#0a4174;color:#fff;font-weight:800;cursor:pointer;margin-top:7px}
.primary-btn:disabled{opacity:.6;cursor:wait}
.hidden{display:none!important}
.status{min-height:23px;font-size:12px;line-height:1.7;text-align:center;margin-top:9px;color:#247348}
.status.error{color:#b42318}
.note,.helper{font-size:11px;line-height:1.8;color:#71869a;text-align:center;margin:10px 0 0}
.note{background:#f3f7fa;border-radius:8px;padding:9px;margin-bottom:12px}
.logged-in{display:none;text-align:center;padding:16px 0 0}
.logged-in h3{font-size:17px;color:#001d39;margin:0 0 8px}
.logged-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.logged-actions a,.logged-actions button{border:0;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:800;cursor:pointer}
.go-home{background:#001d39;color:#fff}.signout{background:#edf3f7;color:#24445e}
.sponsors{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:13px;border-top:1px solid #edf1f4}
.sponsors small{width:100%;text-align:center;font-size:10px;color:#91a0ad}
.sponsors img{max-width:75px;max-height:28px;object-fit:contain}.sponsor-name{font-size:10px;color:#71869a}
footer{text-align:center;padding:12px;color:#8797a5;font-size:10px}
@media(max-width:480px){header{height:56px;padding:0 4%}.brand{font-size:17px}.card{padding:22px 18px}main{padding:18px 12px}.branding h1{font-size:20px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">BHG <span>بدر الحياة</span></a><a class="back" href="index.html">رجوع للموقع</a></header>
<main>
<section class="card">
 <div class="branding"><img id="loginLogo" alt="شعار بدر الحياة"><h1 id="brandName">بدر الحياة</h1><p>تسجيل الدخول</p></div>
 <div class="role-switch">
  <button class="role-btn active" id="customerRoleBtn" onclick="setRole('customer')">عميل</button>
  <button class="role-btn" id="employeeRoleBtn" onclick="setRole('employee')">موظف</button>
 </div>
 <div id="customerPanel">
  <div class="customer-mode"><button id="loginModeBtn" class="mode-link active" onclick="setCustomerMode('login')">دخول</button><button id="registerModeBtn" class="mode-link" onclick="setCustomerMode('register')">حساب جديد</button></div>
  <h2 class="form-title" id="customerFormTitle">دخول العميل</h2>
  <div id="customerNameField" class="field hidden"><label for="customerName">الاسم</label><input id="customerName" type="text" autocomplete="name" placeholder="الاسم بالكامل"></div>
  <div class="field"><label for="customerEmail">البريد الإلكتروني</label><input id="customerEmail" type="email" autocomplete="email" placeholder="name@example.com"></div>
  <div class="field"><label for="customerPassword">كلمة المرور</label><input id="customerPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
  <button id="customerSubmit" class="primary-btn" onclick="submitCustomer()">دخول</button>
  <div id="customerStatus" class="status" aria-live="polite"></div>
  <div id="customerLoggedIn" class="logged-in"><h3 id="customerWelcome">تم تسجيل الدخول</h3><p class="helper">حسابك جاهز.</p><div class="logged-actions"><a class="go-home" href="index.html#customerChat">العودة للموقع</a><button class="signout" onclick="signOut()">خروج</button></div></div>
  <p class="helper" id="customerHint">إنشاء حساب العميل مجاني.</p>
 </div>
 <div id="employeePanel" class="hidden">
  <h2 class="form-title">دخول الموظف</h2>
  <p class="note">استخدم اسم المستخدم وكلمة المرور اللذين استلمتهما من الإدارة.</p>
  <div class="field"><label for="employeeUsername">اسم المستخدم</label><input id="employeeUsername" type="text" autocomplete="username" placeholder="اسم المستخدم"></div>
  <div class="field"><label for="employeePassword">كلمة المرور</label><input id="employeePassword" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
  <button id="employeeSubmit" class="primary-btn" onclick="signInEmployee()">دخول</button>
  <div id="employeeStatus" class="status" aria-live="polite"></div>
 </div>
 <div id="loginSponsors" class="sponsors"><small>الرعاة</small></div>
</section>
</main>
<footer>© 2026 بدر الحياة</footer>
<script>
const SUPABASE_URL='https://lqycfhqmihobrjyycajr.supabase.co';
const SUPABASE_KEY='sb_publishable_KMi-Q7lZ-dCTPnqIhIogIA_wnw2rnpH';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let role='customer',customerMode='login';
function setRole(next){
 role=next;
 $('customerRoleBtn').classList.toggle('active',role==='customer');
 $('employeeRoleBtn').classList.toggle('active',role==='employee');
 $('customerPanel').classList.toggle('hidden',role!=='customer');
 $('employeePanel').classList.toggle('hidden',role!=='employee');
 if(location.hash!==(role==='employee'?'#employee':'#customer'))history.replaceState(null,'',role==='employee'?'#employee':'#customer');
}
function setCustomerMode(mode){
 customerMode=mode;
 $('loginModeBtn').classList.toggle('active',mode==='login');
 $('registerModeBtn').classList.toggle('active',mode==='register');
 $('customerNameField').classList.toggle('hidden',mode!=='register');
 $('customerFormTitle').textContent=mode==='register'?'إنشاء حساب عميل جديد':'دخول حساب العميل';
 $('customerSubmit').textContent=mode==='register'?'إنشاء حساب':'تسجيل الدخول';
 $('customerPassword').autocomplete=mode==='register'?'new-password':'current-password';
 $('customerStatus').textContent='';
}
function setStatus(id,message,bad=false){const el=$(id);el.textContent=message;el.classList.toggle('error',bad)}
async function ensureCustomerProfile(user,name=''){
 const {data,error}=await db.from('platform_profiles').select('account_type,active').eq('user_id',user.id).maybeSingle();
 if(error)throw new Error('تعذر قراءة بيانات الحساب: '+error.message);
 if(data){if(data.account_type!=='customer'||!data.active)throw new Error('هذا المستخدم ليس حساب عميل نشطًا. استخدم دخول الموظفين إذا كان حسابك تابعًا للشركة.');return}
 const {error:insertError}=await db.from('platform_profiles').insert({user_id:user.id,display_name:name||user.user_metadata?.display_name||user.email?.split('@')[0]||'عميل',account_type:'customer',active:true});
 if(insertError)throw new Error('تم تسجيل الدخول لكن تعذر تجهيز ملف العميل: '+insertError.message);
}
async function submitCustomer(){
 const email=$('customerEmail').value.trim(),password=$('customerPassword').value,name=$('customerName').value.trim();
 if(!email||!password){setStatus('customerStatus','اكتب البريد الإلكتروني وكلمة المرور.',true);return}
 if(customerMode==='register'&&(!name||password.length<8)){setStatus('customerStatus','اكتب اسمك وكلمة مرور لا تقل عن 8 أحرف.',true);return}
 const btn=$('customerSubmit');btn.disabled=true;setStatus('customerStatus',customerMode==='register'?'جارٍ إنشاء الحساب…':'جارٍ تسجيل الدخول…');
 try{
  if(customerMode==='register'){
   const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:name}}});
   if(error)throw error;
   if(data.user&&data.session){await ensureCustomerProfile(data.user,name);showCustomerLoggedIn(data.user)}
   else setStatus('customerStatus','تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب، ثم ارجع وسجّل الدخول.');
  }else{
   const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
   try{await ensureCustomerProfile(data.user)}catch(e){await db.auth.signOut();throw e}
   showCustomerLoggedIn(data.user);
  }
 }catch(e){setStatus('customerStatus','تعذر إكمال العملية: '+(e.message||e),true)}
 finally{btn.disabled=false}
}
function showCustomerLoggedIn(user){
 $('customerLoggedIn').style.display='block';
 $('customerWelcome').textContent='أهلاً '+(user.user_metadata?.display_name||user.email||'بيك')+'، تم تسجيل الدخول بنجاح.';
 $('customerModeBtn')?.classList.add('hidden');
 $('customerNameField').classList.add('hidden');
 $('customerEmail').parentElement.classList.add('hidden');
 $('customerPassword').parentElement.classList.add('hidden');
 $('customerSubmit').classList.add('hidden');
 $('customerHint').classList.add('hidden');
 setStatus('customerStatus','تم تسجيل الدخول بنجاح.');
}
async function signInEmployee(){
 const username=$('employeeUsername').value.trim().toLowerCase(),password=$('employeePassword').value;
 if(!username||!password){setStatus('employeeStatus','اكتب اسم المستخدم وكلمة المرور.',true);return}
 const btn=$('employeeSubmit');btn.disabled=true;setStatus('employeeStatus','جارٍ التحقق من حساب الموظف…');
 try{
  const email=username.includes('@')?username:username+'@staff.bhg.local';
  const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
  const {data:p,error:profileError}=await db.from('platform_profiles').select('account_type,active').eq('user_id',data.user.id).maybeSingle();
  if(profileError)throw new Error('تعذر التحقق من بيانات الموظف: '+profileError.message);
  if(!p||p.account_type!=='employee'||!p.active){await db.auth.signOut();throw new Error('الحساب غير مفعل كموظف. راجع إدارة الشركة.')}
  setStatus('employeeStatus','تم الدخول بنجاح. جاري فتح بوابة الموظفين…');
  window.location.href='employee.html';
 }catch(e){setStatus('employeeStatus','تعذر الدخول: '+(e.message||e),true);btn.disabled=false}
}
async function signOut(){await db.auth.signOut();location.reload()}
async function loadBranding(){
 try{
  const {data}=await db.from('site_settings').select('settings').eq('setting_key','main').maybeSingle();
  const v=data?.settings||{};
  if(v.name)$('brandName').textContent=v.name;
  if(v.logo){$('loginLogo').src=v.logo;$('loginLogo').style.display='block'}
 }catch(e){console.warn('Branding unavailable',e)}
 try{
  const {data}=await db.from('sponsors').select('company_name,logo_url,image_url,placement').eq('active',true).in('placement',['footer_logo','header_logo']).order('tier');
  const logos=(data||[]).filter(x=>x.logo_url||x.image_url);
  $('loginSponsors').innerHTML='<small>شركاء بدر الحياة</small>'+(logos.length?logos.map(x=>'<div><img src="'+String(x.logo_url||x.image_url).replace(/"/g,'&quot;')+'" alt=""><div class="sponsor-name">'+String(x.company_name||'').replace(/[&<>]/g,'')+'</div></div>').join(''):'<span class="sponsor-name">شركاؤنا قريبًا</span>');
 }catch(e){console.warn('Sponsors unavailable',e)}
}
document.addEventListener('DOMContentLoaded',async()=>{
 setRole(location.hash==='#employee'?'employee':'customer');
 if(location.hash==='#register')setCustomerMode('register');
 await loadBranding();
 const {data}=await db.auth.getSession();
 if(data.session){
  const {data:p}=await db.from('platform_profiles').select('account_type,active,display_name').eq('user_id',data.session.user.id).maybeSingle();
  if(p?.account_type==='employee'&&p.active){window.location.href='employee.html';return}
  if(p?.account_type==='customer'&&p.active)showCustomerLoggedIn(data.session.user);
 }
});
</script>
</body>
</html>
